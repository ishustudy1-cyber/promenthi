<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promenthi - The one app for useful and effective study</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for Stats -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .light .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col transition-colors duration-300 dark:bg-slate-950 light:bg-slate-50 light:text-slate-900">

    <!-- AUTHENTICATION MODAL (Visible by Default) -->
    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md">
        <div class="glass-card p-8 rounded-3xl w-full max-w-md shadow-2xl border border-slate-700/50 relative">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 text-white shadow-lg shadow-emerald-500/30 mb-3">
                    <i class="fa-solid fa-graduation-cap text-3xl"></i>
                </div>
                <h2 class="text-2xl font-bold tracking-tight">Welcome to Promenthi</h2>
                <p class="text-xs text-slate-400 mt-1">The one app for useful and effective study</p>
            </div>
            
            <div id="authError" class="mb-4 p-3 bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs rounded-xl hidden"></div>

            <form id="authForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Email Address</label>
                    <input type="email" id="authEmail" required class="w-full px-4 py-3 rounded-xl bg-slate-900/50 border border-slate-700 focus:border-emerald-500 focus:outline-none text-sm transition-all dark:bg-slate-900/50 light:bg-white light:border-slate-300" placeholder="student@promenthi.app">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                    <input type="password" id="authPassword" required class="w-full px-4 py-3 rounded-xl bg-slate-900/50 border border-slate-700 focus:border-emerald-500 focus:outline-none text-sm transition-all dark:bg-slate-900/50 light:bg-white light:border-slate-300" placeholder="••••••••">
                </div>
                <button type="submit" id="authSubmitBtn" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-semibold rounded-xl shadow-lg shadow-emerald-500/25 transition-all transform active:scale-95">
                    Login / Sign Up
                </button>
            </form>
            <div class="mt-4 text-center">
                <button type="button" onclick="handleAnonymousLogin()" class="text-xs text-emerald-400 hover:underline font-medium">Continue as Guest (Quick Demo)</button>
            </div>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- TOP HEADER -->
    <header id="mainHeader" class="w-full px-6 py-4 flex items-center justify-between border-b border-slate-800/60 dark:border-slate-800/60 light:border-slate-200 transition-all duration-300">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-white shadow-md shadow-emerald-500/20">
                <i class="fa-solid fa-book-bookmark text-lg"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">Promenthi</h1>
                <p class="text-[10px] text-slate-400 tracking-wide font-medium">Useful & Effective Study</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl glass-card flex items-center justify-center text-slate-300 hover:text-emerald-400 transition-all" title="Toggle Theme">
                <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
            </button>
            <div id="userProfileBadge" class="hidden items-center gap-2 px-3 py-1.5 rounded-xl glass-card text-xs">
                <i class="fa-solid fa-user-check text-emerald-400"></i>
                <span id="userEmailDisplay" class="truncate max-w-[120px] font-medium"></span>
                <button onclick="logoutUser()" class="text-slate-400 hover:text-rose-400 ml-2" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 pb-28">
        <!-- HOME TAB -->
        <section id="tab-home" class="space-y-6">
            <div class="glass-card p-5 rounded-2xl relative overflow-hidden shadow-sm border border-emerald-500/20">
                <div class="flex items-start gap-3">
                    <div class="text-emerald-400 mt-0.5"><i class="fa-solid fa-quote-left text-lg"></i></div>
                    <div class="flex-1">
                        <p id="motivationalQuoteText" class="text-sm font-medium italic text-slate-200 light:text-slate-800">"Loading motivation..."</p>
                        <p id="motivationalQuoteAuthor" class="text-[11px] text-emerald-400 font-semibold mt-1">— Promenthi Wisdom</p>
                    </div>
                    <button onclick="loadNewQuote()" class="text-slate-400 hover:text-emerald-400 transition-colors p-1" title="New Quote">
                        <i class="fa-solid fa-rotate text-xs"></i>
                    </button>
                </div>
            </div>

            <div id="timerConfigPanel" class="glass-card p-6 rounded-3xl shadow-xl space-y-5">
                <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div class="w-full sm:w-auto flex bg-slate-900/60 light:bg-slate-200 p-1 rounded-2xl border border-slate-700/50">
                        <button onclick="setTimerMode('pomodoro')" id="modePomodoroBtn" class="flex-1 sm:flex-none px-5 py-2.5 rounded-xl text-xs font-bold transition-all bg-emerald-500 text-white shadow-md">Pomodoro (50/10)</button>
                        <button onclick="setTimerMode('custom')" id="modeCustomBtn" class="flex-1 sm:flex-none px-5 py-2.5 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-slate-200">Custom Schedule</button>
                    </div>
                </div>
            </div>

            <div id="timerContainerCard" class="glass-card p-8 rounded-3xl shadow-2xl flex flex-col items-center justify-center text-center relative border border-emerald-500/30">
                <div id="timerStatusBadge" class="px-4 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold uppercase tracking-wider mb-6">
                    Focus Session
                </div>
                <div class="relative flex items-center justify-center my-4">
                    <span id="timerDisplay" class="text-6xl md:text-7xl font-extrabold tracking-tighter">50:00</span>
                </div>
                <div class="flex items-center gap-4 mt-8">
                    <button id="startPauseBtn" onclick="toggleTimer()" class="px-8 py-4 bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold rounded-2xl shadow-xl">
                        <span id="startPauseText">Start Focus</span>
                    </button>
                    <button onclick="resetTimer()" class="w-14 h-14 rounded-2xl glass-card flex items-center justify-center text-slate-300">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- STATS TAB -->
        <section id="tab-stats" class="space-y-6 hidden">
            <div class="glass-card p-6 rounded-3xl">
                <h2 class="text-lg font-bold mb-4">Your Study Analytics</h2>
                <div class="h-56"><canvas id="weeklyChart"></canvas></div>
            </div>
        </section>

        <!-- SETTINGS TAB -->
        <section id="tab-settings" class="space-y-6 hidden">
            <div class="glass-card p-6 rounded-3xl space-y-4">
                <h2 class="text-lg font-bold">Preferences</h2>
                <button onclick="openAuthModalManually()" class="px-4 py-2 bg-emerald-500/20 text-emerald-400 text-xs font-semibold rounded-xl border border-emerald-500/30">
                    Open Sign-In / Account Modal
                </button>
            </div>
        </section>
    </main>

    <!-- BOTTOM NAV -->
    <nav id="bottomNavBar" class="fixed bottom-0 left-0 right-0 z-40 max-w-lg mx-auto p-3">
        <div class="glass-card rounded-2xl p-2 flex items-center justify-around shadow-2xl border border-slate-700/50">
            <button onclick="switchTab('home')" id="nav-btn-home" class="flex flex-col items-center gap-1 px-4 py-2 rounded-xl text-emerald-400">
                <i class="fa-solid fa-house"></i><span class="text-[10px]">Home</span>
            </button>
            <button onclick="switchTab('stats')" id="nav-btn-stats" class="flex flex-col items-center gap-1 px-4 py-2 rounded-xl text-slate-400">
                <i class="fa-solid fa-chart-pie"></i><span class="text-[10px]">Stats</span>
            </button>
            <button onclick="switchTab('settings')" id="nav-btn-settings" class="flex flex-col items-center gap-1 px-4 py-2 rounded-xl text-slate-400">
                <i class="fa-solid fa-gear"></i><span class="text-[10px]">Settings</span>
            </button>
        </div>
    </nav>

    <!-- SCRIPT LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        let auth = null;
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

        window.onload = function() {
            setupAuth();
            loadNewQuote();
        };

        function setupAuth() {
            if (!firebaseConfig) return;
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        document.getElementById('userProfileBadge').classList.remove('hidden');
                        document.getElementById('userProfileBadge').classList.add('flex');
                        document.getElementById('userEmailDisplay').innerText = user.email || `Guest (${user.uid.substring(0,6)})`;
                        document.getElementById('authModal').classList.add('hidden');
                    }
                });
            } catch(e) {}
        }

        window.handleAnonymousLogin = function() {
            document.getElementById('authModal').classList.add('hidden');
            showToast("Logged in as Guest successfully.", "success");
        };

        window.openAuthModalManually = function() {
            document.getElementById('authModal').classList.remove('hidden');
        };

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPassword').value;
            const errBox = document.getElementById('authError');
            errBox.classList.add('hidden');

            if (!auth) {
                document.getElementById('authModal').classList.add('hidden');
                showToast("Logged in successfully (Offline).", "success");
                return;
            }

            try {
                try {
                    await signInWithEmailAndPassword(auth, email, pass);
                } catch(err) {
                    await createUserWithEmailAndPassword(auth, email, pass);
                }
                document.getElementById('authModal').classList.add('hidden');
                showToast("Authentication successful!", "success");
            } catch(err) {
                errBox.innerText = err.message;
                errBox.classList.remove('hidden');
            }
        });

        window.logoutUser = async function() {
            if (auth) await signOut(auth);
            document.getElementById('userProfileBadge').classList.add('hidden');
            document.getElementById('authModal').classList.remove('hidden');
            showToast("Logged out successfully.", "info");
        };

        window.showToast = function(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `glass-card px-4 py-3 rounded-2xl border border-emerald-500/30 bg-emerald-500/10 text-emerald-300 text-xs font-semibold shadow-xl flex items-center gap-3`;
            toast.innerHTML = `<i class="fa-solid fa-circle-info"></i> <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        };

        window.switchTab = function(tabName) {
            ['home', 'stats', 'settings'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-btn-${t}`).classList.remove('text-emerald-400');
                document.getElementById(`nav-btn-${t}`).classList.add('text-slate-400');
            });
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`nav-btn-${tabName}`).classList.add('text-emerald-400');
            document.getElementById(`nav-btn-${tabName}`).classList.remove('text-slate-400');
        };

        window.loadNewQuote = function() {
            document.getElementById('motivationalQuoteText').innerText = `"Effective study is not about hours, but focus."`;
        };
        
        let timerRunning = false, timeLeft = 3000;
        window.toggleTimer = function() {
            timerRunning = !timerRunning;
            document.getElementById('startPauseText').innerText = timerRunning ? "Pause" : "Start Focus";
        };
        window.resetTimer = function() {
            timerRunning = false;
            document.getElementById('startPauseText').innerText = "Start Focus";
        };
        window.setTimerMode = function() {};
    </script>
</body>
</html>
